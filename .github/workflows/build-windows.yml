name: Build Free Grind (Windows)

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: COMPILAÇÃO PARA WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Dependências
        run: bun install

      - name: Compilar o App (Windows)
        run: bunx tauri build

      - name: Fazer Upload do .exe
        uses: actions/upload-artifact@v4
        with:
          name: Free-Grind-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
